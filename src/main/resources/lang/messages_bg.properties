#about section
about.h1=Мелия СПА
about.p=С над 10 годишен опит, всеки басейн, който построим е посветен на детайлите и качеството, специално съобразен с вас, вашата собственост и вашият стил на живот. Независимо дали е за дома или търговски басейн, нашите строители и специалисти по проектиране и изграждане предлагат изключителни, несравними дизайни и решения, които да отговорят на всяко желание.
#service section
service.construction.header=Изработка на басейн
service.construction.p=От проект до първото къпане. Ние строим перфектните басейни във всякакви размери приспособени за вашите нужди и желания.
service.maintenance.header=Поддръжка на басейн
service.maintenance.p=Наслаждавай се на своят басейн без грижи с нашата услуга за поддръжка. Почистване, поддръжка, сервизно обслужване на басейни и оборудване през годината.
service.equipment.header=Оборудване за басейни
service.equipment.p=Всичко за басейна на едно място. Химия, помпи, пречистватели и други. Всичко с доставка до мястото.
#pool-type section
pool.type.header=Изберете вида на басейна
pool.type.p1=Обогатете пространството си с елегантен скимер басейн, луксозен безкраен басейн и върховно изживяване - луксозни джакузита.
pool.type.p2=Инвестирайте в дома, хотела или вилата си и създайте свой собствен рай на земята. Потопете се в лукс и комфорт, които ще обогатят още повече преживяването ви в уединена среда.
infinity.pool.header=Безкрайни Басейни
skimmer.pool.header=Скимер Басейни
jacuzzi=Джакузита
#accessories section
accessories.header=Аксесоари за перфектния басейн
accessories.p1=Подобрете удоволствието си с ексклузивно оборудване за басейн.
accessories.p2=Иновации като електролиза на водата, хидромасаж и интелигентни системи за управление осигуряват върховно изживяване в басейна.
accessories.p3=ЛЕД осветлението допълнително обогатява атмосферата, а автоматичната система за почистване поддържа водата кристално чиста.
accessories.electrolysis.header=Електролиза на вода
accessories.electrolysis.p=Устройството преобразува солта в дезинфектант за безопасно и ефективно почистване на басейна, осигурявайки безопасно и здравословно плуване.
accessories.waterfall.header=Водопад
accessories.waterfall.p=Елегантен водопад за естетика и релаксиращ звук, добавящ естествена красота и спокойствие към вашия басейн.
accessories.heat.pump.header=Термопомпа
accessories.heat.pump.p=Използвайте енергията на околната среда за комфортна температура на водата, което ви позволява да се наслаждавате целогодишно с минимална консумация на енергия.
accessories.hydromassage.header=Хидромасаж
accessories.hydromassage.p=Почувствайте лукса на хидромасажа за мускулна релаксация и кръвообращение, осигурявайки изключително удоволствие във вашия басейн.
accessories.air.geysers.header=Въздушни гейзери
accessories.air.geysers.p=Насладете се на усещането за подводен въздушен масаж, който насърчава релаксацията и подобрява кръвообращението в басейна.
accessories.auto.pool.cleaner.header=Автоматична машина за почистване на басейни
accessories.auto.pool.cleaner.p=Поддържайте басейна си чист без усилие с автоматични почистващи устройства, които премахват отломките и го правят готов за ползване.
accessories.chlorine.dispenser.header=Дозатор за хлор
accessories.chlorine.dispenser.p=Той автоматично регулира нивото на хлор, поддържайки безопасна и чиста среда в басейна без редовни корекции.
#parallax section
parallax.header=Превърнете дома си в луксозен оазис и увеличете стойността на имота си
#portfolio section
portfolio.h1=Защо да изберете Мелия СПА?
portfolio.h5=Независимо дали проектът ви е голям или малък, ние можем да ви помогнем с всяка стъпка от процеса, като ви насочваме през решенията, които трябва да вземете и предлагаме решения, съобразени с вашите специфични желания за завършване или обновяване на басейна на мечтите ви.
portfolio.p=Именно тази комбинация дава на нашите клиенти увереността да ни се доверят и за най-взискателните си проекти, както и спокойствието, че всичко е подкрепено от изключителна техническа поддръжка и следпродажбено обслужване.
portfolio.feature.projects.h1=Завършени проекти:
#pre-contact section
pre.contact.h1=Готови ли сте да се гмурнете?
pre.contact.h5=Вашият проект заслужава експертни ръце. Нека обсъдим как можем да ви помогнем с вашия проект за басейн...
