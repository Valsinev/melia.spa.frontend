#about section
about.h1=Melia SPA Swimming Pools
about.p=With over 10 years experience, every pool we build is a dedication to detailand quality meticulously tailored to you, your client, your property and your lifestyle. Whether it?s an indoor or outdoor swimming pool for the home or a commercial pool and wellness space for your discerning clients, our swimming pool builders and design & build specialists provide outstanding, unmatched designs and solutions to meet every desire.
#service section
service.construction.header=Construction of a swimming pool
service.construction.p=From the project to the first bath. We build a perfect swimming pools in all dimensions adapted to your needs and wishes.
service.maintenance.header=Pool maintenance
service.maintenance.p=Enjoy your pool without worries with our maintenance service. Cleaning, maintenance, servicing of pools and equipment during the year.
service.equipment.header=Equipment for swimming pools
service.equipment.p=Everything for the pool in one place. Chemistry, pumps, purifiers and more. Everything with a delivery to the location.
#pool-type section
pool.type.header=Choose the type of pool
pool.type.p1=Enrich your space with an elegant skimmer pool, a luxurious infinity pool and the ultimate wellness experience ? luxurious jacuzzi tubs.
pool.type.p2=Invest in your home, apartment, hotel or villa and create your own paradise on earth. Indulge in luxury and comfort that will further enrich your experience in a private environment.
infinity.pool.header=Infinity Pools
skimmer.pool.header=Skimmer Pools
jacuzzi=Jacuzzi
#accessories section
accessories.header=Accessories for the perfect pool
accessories.p1=Enhance your enjoyment with exclusive pool equipment.
accessories.p2=Innovations such as water electrolysis, hydromassage and smart control systems provide the ultimate pool experience.
accessories.p3=LED lighting further enriches the ambiance, while the automatic cleaning system keeps the water crystal clear.
accessories.electrolysis.header=Electrolysis of water
accessories.electrolysis.p=The device transforms salt into disinfectant for safe and effective pool cleaning, providing a safe and healthy swimming experience.
accessories.waterfall.header=Waterfall
accessories.waterfall.p=An elegant waterfall for aesthetics and relaxing sound, adding natural beauty and tranquility to your pool.
accessories.heat.pump.header=Heat pump
accessories.heat.pump.p=Use the energy of the environment for a comfortable water temperature, enabling year-round enjoyment with minimal energy consumption.
accessories.hydromassage.header=Hydromassage
accessories.hydromassage.p=Feel the luxury of hydromassage for muscle relaxation and circulation, providing exceptional enjoyment in your pool.
accessories.air.geysers.header=Air geysers
accessories.air.geysers.p=Enjoy the feeling of an underwater air massage, promoting relaxation and improving circulation in the pool.
accessories.auto.pool.cleaner.header=Automatic pool cleaner
accessories.auto.pool.cleaner.p=Keep your pool clean effortlessly with automatic cleaners, removing debris and keeping it ready to enjoy.
accessories.chlorine.dispenser.header=Chlorine dispenser
accessories.chlorine.dispenser.p=It automatically regulates the chlorine level, maintaining a safe and clean pool environment without regular adjustments.
#parallax section
parallax.header=Turn your home into a luxury oasis and increase the value of your property
#portfolio section
portfolio.h1=Why Choose Melia SPA?
portfolio.h5=Whether your project is big or small, we can help with every step of the process, guiding you through the decisions you?ll need to consider and offering solutions tailored to your specific desires to complete or refurbish your dream pool.
portfolio.p=It?s this combination that gives our clients the confidence to trust us with their most demanding projects and peace of mind that everything is backed up by exceptional technical support and after-sales service.
