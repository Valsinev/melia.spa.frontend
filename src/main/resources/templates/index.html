<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8">

<!--	<meta name="viewport" content="width=device-width, initial-scale=1.0">-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<title th:text="#{home}">Home</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/index.css}">
	<link rel="stylesheet" th:href="@{/css/default.css}">

</head>
<body>

<section th:replace="~{fragments/head::head}"></section>

<section class="main-content">

	<div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
		<div class="carousel-indicators">
			<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
			<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
			<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
		</div>

		<div class="carousel-inner">
			<div class="carousel-item active">
				<img class="d-block w-100" src="https://nuviewoutdoor.com/wp-content/uploads/2023/05/Amy-8.jpg" alt="First slide">
				<div class="carousel-caption d-none d-md-block">
					<h5>...</h5>
					<p>...</p>
				</div>
			</div>
			<div class="carousel-item">
				<img class="d-block w-100" src="https://i.ytimg.com/vi/J8ELms5IeG0/maxresdefault.jpg" alt="Second slide">
				<div class="carousel-caption d-none d-md-block">
					<h5>...</h5>
					<p>...</p>
				</div>
			</div>
			<div class="carousel-item">
				<img class="d-block w-100" src="https://www.aquapool.com/wp-content/uploads/2023/11/Pool-Maintenance.png" alt="Third slide">
				<div class="carousel-caption d-none d-md-block">
					<h5>...</h5>
					<p>...</p>
				</div>
			</div>
		</div>

		<button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
			<span class="carousel-control-prev-icon" aria-hidden="true"></span>
		</button>
		<button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
			<span class="carousel-control-next-icon" aria-hidden="true"></span>
		</button>
	</div>



	<!-- Top section (before reveal) -->
	<div class="container spacer d-flex align-items-center justify-content-center">
		<div>
			<h1>Welcome</h1>
			<p>Scroll down to reveal the hidden background.</p>
		</div>
	</div>


	<!-- Parallax reveal section -->
	<div class="parallax">
		<div class="overlay">
			<h2>This is the hidden image revealed!</h2>
		</div>
	</div>


	<!-- Bottom section -->
	<div class="container spacer d-flex align-items-center justify-content-center">
		<div>
			<h1>After the Reveal</h1>
			<p>Keep scrolling for more content.</p>
		</div>
	</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
<script th:src="@{/js/index.js}"></script>

</body>
</html>
