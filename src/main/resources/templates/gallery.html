<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8">
	<title th:text="#{gallery}">Gallery</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/gallery.css}">
	<link rel="stylesheet" th:href="@{/css/default.css}">

</head>
<body>

<section th:replace="~{fragments/head::head}"></section>

<section class="main-content">
	<div class="row">
		<div class="custom-card">
			<div class="card-body">
				<div class="container-fluid">
					<div class="row">

						<div class="col-4 mt-3 mb-3" th:each="image : ${imageNames}">
							<img th:src="@{'/gallery/' + ${image}}" class="img equal-img" alt="..." onclick="openModal(this.src)">
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Image Modal -->
	<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content bg-transparent border-0">
				<div class="modal-body text-center p-0">
					<img id="modalImage" src="" class="img-fluid rounded" alt="Full Size Image">
				</div>
			</div>
		</div>
	</div>
</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
<script th:src="@{/js/gallery.js}"></script>

</body>
</html>
